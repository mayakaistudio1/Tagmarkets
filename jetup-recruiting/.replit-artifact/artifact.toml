kind = "slides"
previewPath = "/"
title = "JetUP Recruiting Presentation"
version = "1.0.0"
id = "artifacts/jetup-recruiting"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21051

[services.development]
run = "pnpm --filter @workspace/jetup-recruiting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jetup-recruiting", "run", "build" ]
publicDir = "artifacts/jetup-recruiting/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21051"
BASE_PATH = "/"
